<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Fintrack Pro</title>
    <link rel="stylesheet" href="login_style.css">
    <script src="register_script.js" defer></script>
</head>
<body>
    <div class="login-box">
        <h3>Create Account</h3>
        <p id="heading_para">Join FinTrack Pro</p>
        <form action="" class="login_inputs">
            <label for="username">Choose a Username</label>
            <input type="text" name="username" id="username" required>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>
            <input type="submit" value="Register" id="login-btn" class="active">
        </form>
        <div class="footer-para">
            <p>Already have an account?</p>
            <a href="index.html">Login here</a>
        </div>
    </div>
</body>
</html>
